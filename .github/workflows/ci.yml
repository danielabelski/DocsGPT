name: Build and push DocsGPT Docker image

on:
  release:
    types: [published]

jobs:
  build:
    if: github.repository == 'arc53/DocsGPT'
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
        # "" is the slim default image; "-docling" bakes the docling parser
        # engine, its models and tesseract in (OCR-ready).
        variant: ["", "-docling"]
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          install: true

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (OCI labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKER_USERNAME }}/docsgpt
            ghcr.io/${{ github.repository_owner }}/docsgpt
          labels: |
            org.opencontainers.image.title=DocsGPT${{ matrix.variant }}
            org.opencontainers.image.version=${{ github.event.release.tag_name }}

      - name: Build and push platform-specific images
        uses: docker/build-push-action@v6
        with:
          file: './application/Dockerfile'
          platforms: ${{ matrix.platform }}
          context: ./application
          push: true
          build-args: |
            EXTRAS=${{ matrix.variant == '-docling' && 'docling' || '' }}
            INSTALL_TESSERACT=${{ matrix.variant == '-docling' && 'true' || 'false' }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/docsgpt:${{ github.event.release.tag_name }}${{ matrix.variant }}-${{ matrix.platform == 'linux/arm64' && 'arm64' || 'amd64' }}
            ghcr.io/${{ github.repository_owner }}/docsgpt:${{ github.event.release.tag_name }}${{ matrix.variant }}-${{ matrix.platform == 'linux/arm64' && 'arm64' || 'amd64' }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/docsgpt:latest${{ matrix.variant }}
          cache-to: type=inline

  manifest:
    if: github.repository == 'arc53/DocsGPT'
    needs: build
    strategy:
      matrix:
        variant: ["", "-docling"]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          install: true

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifests
        env:
          TAG: ${{ github.event.release.tag_name }}${{ matrix.variant }}
          LATEST: latest${{ matrix.variant }}
        run: |
          set -e
          for repo in "${{ secrets.DOCKER_USERNAME }}/docsgpt" "ghcr.io/${{ github.repository_owner }}/docsgpt"; do
            for name in "$TAG" "$LATEST"; do
              docker manifest create "$repo:$name" \
                --amend "$repo:$TAG-amd64" \
                --amend "$repo:$TAG-arm64"
              docker manifest push "$repo:$name"
            done
          done

  release-assets:
    if: github.repository == 'arc53/DocsGPT'
    needs: manifest
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Attach the standalone compose file to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            deployment/docker-compose-standalone.yaml --clobber
